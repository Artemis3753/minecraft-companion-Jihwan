<!-- 색을 hex로 박아 둔 이유: favicon은 <link>로 불리는 별개 문서라 index.css의
     변수를 못 본다. 값 자체는 팔레트에서 가져왔다 — 윗면 accent, 옆면 둘은
     gray-600/gray-800. (변수명 앞의 대시 둘은 XML 주석에 못 넣는다.)

     옆면 둘의 밝기를 한 칸이 아니라 두 칸 벌렸다. 바로 옆 단계로 두면 16px에서
     두 면이 한 덩어리로 뭉쳐 큐브가 아니라 오각형으로 보인다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <path d="M16 4 27 10 16 16 5 10Z" fill="#60a5fa" />
  <path d="M5 10 16 16 16 28 5 22Z" fill="#515f6c" />
  <path d="M27 10 16 16 16 28 27 22Z" fill="#33404d" />
</svg>
